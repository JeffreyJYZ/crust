<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Extensions</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				padding: 2rem;
				background: #12100e;
				color: #ece7e1;
			}
			main {
				max-width: 42rem;
				margin: 0 auto;
			}
			h1 {
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				font-family: ui-monospace, monospace;
				font-size: 0.8125rem;
				color: #a9a199;
			}
			button {
				margin-right: 0.5rem;
				padding: 0.4rem 0.9rem;
				border: 1px solid #3a332c;
				border-radius: 0.375rem;
				background: #1d1916;
				color: inherit;
				font: inherit;
			}
			ul {
				font-family: ui-monospace, monospace;
				font-size: 0.8125rem;
				padding-left: 1.1rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>clock — an extension, reached from the page</h1>
			<p id="reading">asking the extension…</p>
			<p>
				<button id="start" type="button">clock.startTimer</button>
				<button id="stop" type="button">clock.stopTimer</button>
			</p>
			<ul id="log"></ul>
		</main>
		<script src="/app.js"></script>
	</body>
</html>
