<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Hello crust</title>
		<style>
			:root { color-scheme: dark; }
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #0b0b0c;
				color: #e7e7ea;
				font: 14px/1.5 ui-monospace, SFMono-Regular, monospace;
			}
			main { display: grid; gap: 10px; text-align: center; }
			h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: 0.02em; }
			#answer { color: #7fd1ff; min-height: 1.5em; }
			#status { color: #8a8a93; font-size: 12px; }
		</style>
	</head>
	<body>
		<main>
			<h1>Hello crust</h1>
			<p id="answer">asking the backend…</p>
			<p id="status">window.crust.invoke("greet", { name })</p>
		</main>
		<script>
			// The bridge injects window.crust into <head>; crust's runtime injects a
			// one-name invoke shim at <body>, so this script can call an app command
			// by name, exactly as DESIGN.md §5 shows.
			const answer = document.getElementById("answer");
			const status = document.getElementById("status");
			window.crust.invoke("greet", { name: "jyz" }).then((greeting) => {
				answer.textContent = greeting;
				status.textContent = "answered over the bridge · " + window.crust.baseUrl;
			}).catch((error) => {
				answer.textContent = "invoke failed";
				status.textContent = String(error && error.message ? error.message : error);
			});
		</script>
	</body>
</html>
