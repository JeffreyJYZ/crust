<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>crust + Vite</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-content: center;
				gap: 1rem;
				font:
					16px/1.5 ui-sans-serif,
					system-ui,
					sans-serif;
				background: #111;
				color: #eee;
			}
			main {
				width: 26rem;
			}
			h1 {
				margin: 0 0 0.25rem;
				font-size: 1.05rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: #8a8a8a;
			}
			button {
				font: inherit;
				padding: 0.5rem 1rem;
				border: 1px solid #333;
				border-radius: 6px;
				background: #1b1b1b;
				color: #eee;
			}
			button:hover {
				background: #242424;
			}
			pre {
				margin: 0.75rem 0 0;
				font-family: ui-monospace, monospace;
				font-size: 0.85rem;
				color: #7ee787;
				white-space: pre-wrap;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>crust + Vite</h1>
			<button id="go" type="button">invoke("greet")</button>
			<pre id="out">waiting…</pre>
		</main>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
