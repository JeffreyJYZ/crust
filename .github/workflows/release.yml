name: release

# A `v*` tag ships the standalone binary: one compiled executable per OS and arch,
# attached to the GitHub Release for that tag. No npm anywhere — crust is never published
# to a registry, so this workflow never runs `npm publish` or `npm install`.
#
# Push ONE tag at a time. Pushing several tags in a single `git push` silently drops their
# runs, and the batch then looks like a release that never started:
#
#     git push origin v0.1.22
#
# The version is never written in this file: it is `package.json`'s. Every job passes
# `--expect-version "${{ github.ref_name }}"`, which fails unless the tag names that
# version — and on the host's own target the binary's own `--version` is asserted too.

on:
    push:
        tags: ["v*"]

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    # One release per tag, created before any asset exists. Five build jobs uploading to a
    # release that may not exist yet is six chances to race on `gh release create`, and a
    # second creator fails on the duplicate. It is a DRAFT until every leg and the verifier
    # pass: a failed matrix leg must never leave a public "Latest" holding a subset of the
    # binaries (measured once already — a win32-x64 target error shipped four assets).
    create-release:
        name: create release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            # A tag that disagrees with package.json would publish assets whose embedded
            # version is not the tag's, so it stops here before a release exists at all.
            - name: assert the tag names package.json's version
              run: |
                  version="$(bun -e 'console.log(require("./package.json").version)')"
                  if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
                    echo "tag ${GITHUB_REF_NAME} does not name package.json's version ${version}" >&2
                    exit 1
                  fi
                  echo "${GITHUB_REF_NAME} is crust ${version}"

            - name: create the release once
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "release $GITHUB_REF_NAME already exists; the build jobs attach to it"
                    # A retried tag may still carry the FAILED BUILD title from an earlier
                    # run; put it back before the legs start again.
                    gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                      --title "crust $GITHUB_REF_NAME"
                  else
                    gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                      --title "crust $GITHUB_REF_NAME" --generate-notes --draft
                  fi

    build:
        name: build (${{ matrix.target }})
        needs: create-release
        strategy:
            # Six assets on six runners: a red Linux build must neither mask nor be masked
            # by a green macOS one, and each lane's log is its own.
            fail-fast: false
            matrix:
                include:
                    - target: bun-darwin-arm64
                      runner: macos-latest
                    - target: bun-darwin-x64
                      runner: macos-latest
                    - target: bun-linux-x64
                      runner: ubuntu-latest
                    - target: bun-linux-arm64
                      runner: ubuntu-latest
                    - target: bun-windows-x64
                      runner: windows-latest
                    # A native arm runner, not `windows-latest` with a cross-compile:
                    # `build-standalone` executes its own binary on the host target
                    # (`--version`, init counts, `doctor`), and the app's TinyCC shim is
                    # compiled at runtime on the machine that runs it, so the proof has
                    # to happen on real Windows arm64 silicon. `windows-11-arm` is a
                    # standard GA GitHub-hosted runner (arm64, Windows 11), so this leg
                    # can prove what an x64 runner would only print as SKIP.
                    - target: bun-windows-arm64
                      runner: windows-11-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            # Bun is the whole toolchain, so its version decides the binary's bytes. Pin it:
            # an unpinned setup-bun silently tracks whatever is current that week, and the
            # released artefact would change size without a source change. Stable 1.4.4 is
            # deliberate: `--aot` is accepted but byte-identical here (examples/hello
            # 89,820,386 B with and without it), so there is no size win to chase with a
            # floating canary; a future canary can be pinned by revision once it actually
            # buys the documented 85.27 -> 53.10 MiB.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - run: bun install --frozen-lockfile

            # Compiles `dist/crust-<version>-<os>-<arch>[.exe]` with `--asset=src` and the
            # rest of the embedded tree, then proves it on the runner's own target: `--version`
            # against package.json, all three `init` scaffolds with their file counts, and
            # `doctor`. A binary for another OS cannot run on this runner, so that half is
            # skipped and printed as skipped — never silently passed.
            - name: build ${{ matrix.target }}
              run: bun run scripts/build-standalone.ts --target "${{ matrix.target }}" --expect-version "${{ github.ref_name }}"

            # `shell: bash` on every OS, because PowerShell does not expand `dist/crust-*`
            # for a native command and `gh` would then receive the literal pattern.
            - name: attach to the release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s nullglob
                  assets=(dist/crust-*)
                  if [ "${#assets[@]}" -ne 1 ]; then
                    echo "expected exactly one built asset in dist/, found ${#assets[@]}: ${assets[*]}" >&2
                    exit 1
                  fi
                  echo "uploading ${assets[0]} to release ${GITHUB_REF_NAME}"
                  gh release upload "$GITHUB_REF_NAME" "${assets[0]}" --repo "$GITHUB_REPOSITORY" --clobber

    # Reads the release, not this checkout: every expected asset must be attached,
    # non-trivial in size, and the right container for its OS, and the runner's own platform's
    # asset must execute and print the tag's version. `scripts/release/verify-assets.ts` is the
    # committed verifier; `scripts/verify-release.ts` is a different one for a macOS `.app`.
    # `always()` keeps this verifier on the hook even when a build leg failed — that is exactly
    # the run where users need to hear which assets are missing, not a silent skip.
    verify:
        name: verify assets
        needs: [create-release, build]
        if: ${{ always() && needs.create-release.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            # No `bun install`: the verifier imports package.json and nothing else, and it
            # reads the release's bytes rather than anything this clone built.
            - name: verify every attached asset
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun run scripts/release/verify-assets.ts "${{ github.ref_name }}"

    # The only step allowed to make the release public. It has no `if`: GitHub skips a job
    # whose `needs` did not all succeed, so a red leg or a red verifier leaves the draft alone.
    publish:
        name: publish verified release
        needs: [create-release, build, verify]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: publish the verified release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
                  echo "published $GITHUB_REF_NAME after every build leg and the verifier passed"

    # A failed run still says so on the release itself, and the draft is explicit about why it
    # was never published. `always()` is scoped to build/verify failure: if the tag disagreed
    # with package.json there is no release to annotate.
    flag-failed:
        name: flag failed release
        needs: [create-release, build, verify]
        if: ${{ always() && needs.create-release.result == 'success' && (needs.build.result != 'success' || needs.verify.result != 'success') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: mark the draft as a failed release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                    --title "crust $GITHUB_REF_NAME — FAILED BUILD"
                  echo "left $GITHUB_REF_NAME as a flagged draft"
