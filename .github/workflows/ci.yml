name: ci

# Everything here is macOS-only. The runtime compiles its `.c` shim with TinyCC at
# launch and drives a system `WKWebView`, and the e2e suites build a real `.app` and
# launch its binary windowed. None of that exists on a Linux runner, so a second OS
# in the matrix would prove a product this repo does not ship.
#
# The e2e suites need a window server session; a runner that has none skips them and
# says so in the log rather than failing (see the "window session" step). `bun check`,
# the unit suite and `verify:package` need no window and always run.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (macOS)
    # A windowed e2e bundle plus a pack/install cycle; the unit suite alone is seconds.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The multi-file decision diffs against the PR base, which must be present.
          fetch-depth: 0

      # Bun is the whole toolchain: no Rust, no Node, no bundled Chromium.
      # No version pin: the major tag tracks the current release, and a remembered
      # number here silently stops tracking what a contributor actually runs.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Type errors and formatting-independent checks over src/.
      - run: bun check

      - run: bun run test

      # Packs a tarball, installs it into a temp dir and runs `crust --help` and
      # `crust init probe --react` from the installed copy. This is the only check
      # that catches a package shipping without a file it needs, so it is not optional.
      - name: verify package
        run: bun run verify:package

      # A built app opens an NSWindow with a WKWebView, so the e2e run needs an Aqua
      # session and a WindowServer. Probe for both and record the answer; the steps
      # below use it instead of assuming this runner's shape.
      - name: window session
        id: window
        run: |
          uid="$(id -u)"
          if launchctl print "gui/$uid" >/dev/null 2>&1 && pgrep -x WindowServer >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Aqua session and WindowServer are present; the app can open a window."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Aqua session (gui/$uid) or no WindowServer, so a Cocoa window cannot open."
          fi

      # `crust build` signs and bundles `examples/hello`, launches its binary
      # directly (never `open`) and asserts the page's command was answered.
      - name: e2e
        if: steps.window.outputs.available == 'true'
        run: bun run e2e

      # Whether this change touches the multi-file path, i.e. the runtime or the
      # `examples/notes` app. On a push to main there is no PR base, so it runs.
      - name: multi-file e2e decision
        id: multi
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No pull-request base (push to main); running the multi-file e2e."
            exit 0
          fi
          files="$(git diff --name-only "$base...HEAD" -- src examples/notes)"
          if [ -n "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Multi-file path changed:\n%s\n' "$files"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "src/ and examples/notes/ are untouched; skipping the multi-file e2e."
          fi

      # The multi-file proof: three embedded assets, backend-owned state, a page that
      # calls a command on load.
      - name: e2e notes
        if: steps.window.outputs.available == 'true' && steps.multi.outputs.run == 'true'
        run: bun run e2e:notes

      - name: e2e skipped
        if: steps.window.outputs.available != 'true'
        run: |
          echo "::notice title=e2e skipped::This runner has no Aqua session, so a built app cannot open a window. Run 'bun run e2e' on a Mac with a desktop session to prove the bundle."
          echo "skipped: no window session (see the 'window session' step above)"
